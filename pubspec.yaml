name: thingsboard_client
version: 5.0.0
description: ThingsBoard REST API client for Flutter. JWT auth, auto-refresh, WebSocket telemetry, typed error handling.
homepage: https://thingsboard.io
repository: https://github.com/thingsboard/dart_thingsboard_client
issue_tracker: https://github.com/thingsboard/dart_thingsboard_client/issues
topics:
  - thingsboard
  - iot
  - rest-api
  - flutter
  - websocket


environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  dio: '^5.7.0'
  collection: '>=1.15.0 <2.0.0'
  web_socket_channel: '^3.0.3'
  pretty_dio_logger: '^1.4.0'
  jwt_decoder: '^2.0.1'
  one_of: '>=1.5.0 <2.0.0'
  one_of_serializer: '>=1.5.0 <2.0.0'
  built_value: '>=8.4.0 <9.0.0'
  built_collection: '>=5.1.1 <6.0.0'

dev_dependencies:
  built_value_generator: '>=8.4.0 <9.0.0'
  build_runner: ^2.4.0
  test: ^1.25.0
  stream_channel: ^2.1.0
  fake_async: ^1.3.1
  lints: ^6.0.0
